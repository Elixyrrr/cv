<section class="resume-section p-3 p-lg-5 d-flex flex-column" id="experience">
  <style>
    .experience-company-row{display:flex;align-items:center;gap:.85rem;margin-bottom:1rem}
    .experience-logo-wrap{flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .experience-logo-img{width:64px;height:64px;object-fit:contain;margin:0}
    .experience-company-text{flex:1;min-width:0;line-height:1.35}
    .experience-company-text p{margin-bottom:0}
    @media (max-width:767.98px){.experience-company-row{align-items:flex-start}}
  </style>
  <div class="my-auto" id="experience-content">
  <h2 class="mb-5">{{ i18n "experience" }}</h2>
    {{ range site.Data.experience }}
        <div class="resume-item d-flex flex-column flex-md-row mb-5">
          <div class="resume-content mr-auto">
            <h3 class="mb-0">{{ .role }}</h3>
            <div class="experience-company-row">
              {{ with .logo }}
              <div class="experience-logo-wrap">
                <img class="experience-logo-img" src="{{ . }}" alt="" width="64" height="64" loading="lazy" decoding="async">
              </div>
              {{ end }}
              <div class="subheading mb-0 experience-company-text">{{ .company | markdownify }}</div>
            </div>
            <p>{{ .summary | markdownify }}</p>
          </div>
          <div class="resume-date text-md-right">
            <span class="text-primary">{{ .range }}</span>
          </div>
        </div>
    {{ end }}
  </div>

</section>
